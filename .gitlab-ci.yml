stages: [test]

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

taste_system_tests:
  stage: test
  image: python:3.11
  rules:
    - exists: ["ARCHIVE 2/tests/test_taste_system.py"]
  script:
    - python -m py_compile "ARCHIVE 2/brain/archive_brain.py" "ARCHIVE 2/brain/taste_system.py" "ARCHIVE 2/brain/director.py" "ARCHIVE 2/brain/editor_personality.py"
    - python "ARCHIVE 2/tests/test_taste_system.py"
